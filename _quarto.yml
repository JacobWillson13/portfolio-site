project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
  resources:
    - assets/js/lightbox.js
    - assets/pdf/*.pdf
    - dashboards/*.html
    - _redirects
    - assets/img/social-card.png

website:
  title: "Jacob Willson"
  site-url: "https://jacobwillson.com"
  description: "Projects and experience of Jacob Willson: business intelligence, analytics engineering, and applied AI evaluation."
  favicon: assets/img/favicon.svg
  image: assets/img/social-card.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  search: false
  navbar:
    background: white
    foreground: dark
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: "https://github.com/JacobWillson13"
        aria-label: GitHub
      - icon: linkedin
        href: "https://www.linkedin.com/in/jacob-j-willson/"
        aria-label: LinkedIn
      - text: Contact
        href: "mailto:Jacob.Willson13@gmail.com"
  page-footer:
    border: true
    left: "© 2026 Jacob Willson"
    right:
      - icon: envelope
        href: "mailto:Jacob.Willson13@gmail.com"
        aria-label: Email
      - icon: github
        href: "https://github.com/JacobWillson13"
        aria-label: GitHub
      - icon: linkedin
        href: "https://www.linkedin.com/in/jacob-j-willson/"
        aria-label: LinkedIn

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    link-external-newwindow: true
    smooth-scroll: true

execute:
  freeze: auto
